org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
# Non-host native tests are not run locally (Windows): the matching CI host jobs run them
# (linuxX64 on the ubuntu job, linuxArm64 on the arm64 Linux job, macosArm64 and the iOS
# simulator on the macOS job, mingwX64 on the Windows job); local builds only
# cross-compile. This property silences the host-mismatch "Native task disabled" warnings.
kotlin.native.ignoreDisabledTargets=true
