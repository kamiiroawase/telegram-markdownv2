org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
# Non-host native tests are not run locally (Windows): the matching CI host jobs run them
# (linuxX64 on the ubuntu job, macosArm64 and the iOS simulator on the macOS job, mingwX64
# on the Windows job; linuxArm64 has no host anywhere — Kotlin/Native does not support
# Linux ARM64 as a build/test host, see native-target-support.html — so it stays
# cross-compile only); local builds only cross-compile. This property silences the
# host-mismatch "Native task disabled" warnings.
kotlin.native.ignoreDisabledTargets=true
