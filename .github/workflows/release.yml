# Triggered on v* tag pushes: publishes the KMP module artifacts to Maven Central
# (signed, Central Portal, auto-released), republishes them to the local Maven repo for
# the GitHub Release attachments (aar/jar/klib plus pom/module/sources files, creating
# the Release when it does not exist), attaches the CI benchmark output for that release,
# and fails loudly when the READMEs' documented version coordinates were not bumped with
# the tag. The full build gate (compile, host tests, format and API checks) runs on the
# tag itself before anything is published — a tag may point at a commit that never went
# through the Build workflow, and a Central publication cannot be undone.
#
# Required repository secrets (Central Portal: https://central.sonatype.com) — the same
# values the commonmark-kotlin repo publishes with; GitHub secrets are per-repository,
# copy them over:
#   ORG_GRADLE_PROJECT_mavenCentralUsername / …Password — a Portal user token
#   ORG_GRADLE_PROJECT_signingInMemoryKey — the ASCII-armored secret key
#     (gpg --export-secret-keys --armor …)
#   ORG_GRADLE_PROJECT_signingInMemoryKeyId — the key id
#   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword — that key's passphrase
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full clone: the version derives from the nearest v* tag; a shallow clone misses it
          fetch-depth: 0

      # The READMEs document the released coordinates; a forgotten bump
      # ships stale versions to every reader until someone notices. Fail the release
      # instead: the tag version must be present, the previous tag's version must be gone,
      # and CHANGELOG.md must carry the tag's version section (history keeps old versions,
      # so only the new one is required there). The match is token-anchored — a plain
      # fixed-string grep would hit substrings (1.1.0 inside 11.1.0 or 1.1.0.1)
      - name: Check README and CHANGELOG version coordinates match the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION"
          mentions_version() {
            grep -Eq "(^|[^0-9.])${1//./\\.}([^0-9.]|$)" "$2"
          }
          for doc in README.md README.en.md; do
            mentions_version "$VERSION" "$doc" || { echo "$doc does not mention version $VERSION"; exit 1; }
          done
          mentions_version "$VERSION" CHANGELOG.md || {
            echo "CHANGELOG.md has no $VERSION section — move Unreleased under it"
            exit 1
          }
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            PREV_VERSION="${PREV_TAG#v}"
            for doc in README.md README.en.md; do
              if mentions_version "$PREV_VERSION" "$doc"; then
                echo "$doc still mentions the previous version $PREV_VERSION — bump the documented coordinates"
                exit 1
              fi
            done
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      # Same gate the Build workflow runs on main: the tag may point at a commit that
      # never went through CI (pushed from a feature branch, say), and publishing to
      # Central is irreversible — verify before anything is published
      - name: Build and test
        run: chmod +x gradlew && ./gradlew build

      - name: Publish to local Maven
        run: chmod +x gradlew && ./gradlew publishToMavenLocal

      # The tag checkout sits exactly on the v* tag, so the exact-match derivation must
      # produce precisely the tag version — a SNAPSHOT here would publish the release
      # assets under wrong coordinates and break every documented lookup
      - name: Verify published version equals the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -d "$HOME/.m2/repository/io/github/kamiiroawase/telegram-markdownv2/$VERSION" || {
            echo "expected published version $VERSION (exact-match tag derivation), found instead:"
            ls "$HOME/.m2/repository/io/github/kamiiroawase/telegram-markdownv2"
            exit 1
          }

      # The real distribution: signed artifacts uploaded to the Central Portal and
      # released automatically. --no-configuration-cache keeps the publish task out of
      # any third-party config-cache edge cases; the release must not fail on those
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache

      # Fresh measurements ship with every release as the GitHub Release attachment, so
      # the reference numbers stay comparable against recent CI data
      - name: Run JVM rendering benchmark
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew benchmark --console=plain 2>&1 | tee benchmark.txt

      - name: Collect release assets
        run: |
          M2="$HOME/.m2/repository/io/github/kamiiroawase"
          STAGE="release-assets"
          mkdir -p "$STAGE"
          for module in \
            telegram-markdownv2 \
            telegram-markdownv2-android \
            telegram-markdownv2-jvm \
            telegram-markdownv2-js \
            telegram-markdownv2-wasm-js \
            telegram-markdownv2-linuxx64 \
            telegram-markdownv2-linuxarm64 \
            telegram-markdownv2-macosarm64 \
            telegram-markdownv2-mingwx64 \
            telegram-markdownv2-iosarm64 \
            telegram-markdownv2-iosx64 \
            telegram-markdownv2-iossimulatorarm64; do
            find "$M2/$module" -type f ! -name 'maven-metadata-local.xml' -exec cp {} "$STAGE/" \;
          done
          echo "Collected $(find "$STAGE" -type f | wc -l) files"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
            benchmark.txt
          generate_release_notes: true
