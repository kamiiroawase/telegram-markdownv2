name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full clone: git describe needs the commit history to reach tags; a shallow
          # clone misses the nearest tag
          fetch-depth: 0

      # Both READMEs quote the exact behavior-level test count; a PR that adds or removes
      # tests without bumping it ships a stale number to every reader. Same spirit as the
      # release workflow's version-coordinate check, on the suite size instead. The @Test
      # annotations in commonTest count one per test method, matching the number the
      # platforms execute
      - name: Check README test counts match the suite
        run: |
          COUNT=$(grep -h "@Test" src/commonTest/kotlin/io/github/kamiiroawase/markdownv2/*.kt | wc -l | tr -d ' ')
          test "$COUNT" -gt 0
          grep -q "$COUNT 个行为级测试" README.md || { echo "README.md test count is stale — the suite has $COUNT"; exit 1; }
          grep -q "$COUNT behavior-level tests" README.en.md || { echo "README.en.md test count is stale — the suite has $COUNT"; exit 1; }
          echo "README test counts match: $COUNT"

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      # spotlessCheck hooks into check, so build already includes the format check;
      # iOS/macOS/Windows targets cross-compile on Linux; jvm/android unit tests and
      # js/wasm (Node) tests run on the host
      - name: Build, test and check format
        run: chmod +x gradlew && ./gradlew build

      # The Maven Central publish itself runs only in the Release workflow (tag push, with
      # credentials); here the publishing pipeline gets its only CI coverage: after
      # publishing to the local Maven repo, assert that all twelve KMP modules (root +
      # android/jvm/js/wasmJs/linux/macos/mingw/ios) publish their artifacts under a single
      # version directory and the pom carries the commonmark transitive dependency. The
      # exact-tag version derivation is end-to-end guarded in the Release workflow (which
      # checks the tag out); here the version is whatever the current HEAD derives —
      # 0.0.0-SNAPSHOT on a plain main push (HEAD sits past the tag, by design: the
      # released number never sticks to unreleased commits), the tag version only when
      # main HEAD is itself tagged
      - name: Verify Maven publishing
        run: |
          ./gradlew publishToMavenLocal
          GROUP_DIR="$HOME/.m2/repository/io/github/kamiiroawase"
          ROOT="$GROUP_DIR/telegram-markdownv2"
          test "$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          VERSION=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n 1)
          test -n "$VERSION"
          A="$ROOT/$VERSION"
          for art in \
            "$A/telegram-markdownv2-$VERSION.module" \
            "$A/telegram-markdownv2-$VERSION.jar" \
            "$GROUP_DIR/telegram-markdownv2-android/$VERSION/telegram-markdownv2-android-$VERSION.aar" \
            "$GROUP_DIR/telegram-markdownv2-jvm/$VERSION/telegram-markdownv2-jvm-$VERSION.jar" \
            "$GROUP_DIR/telegram-markdownv2-js/$VERSION/telegram-markdownv2-js-$VERSION.klib" \
            "$GROUP_DIR/telegram-markdownv2-wasm-js/$VERSION/telegram-markdownv2-wasm-js-$VERSION.klib" \
            "$GROUP_DIR/telegram-markdownv2-linuxx64/$VERSION/telegram-markdownv2-linuxx64-$VERSION.klib" \
            "$GROUP_DIR/telegram-markdownv2-linuxarm64/$VERSION/telegram-markdownv2-linuxarm64-$VERSION.klib" \
            "$GROUP_DIR/telegram-markdownv2-macosarm64/$VERSION/telegram-markdownv2-macosarm64-$VERSION.klib" \
            "$GROUP_DIR/telegram-markdownv2-mingwx64/$VERSION/telegram-markdownv2-mingwx64-$VERSION.klib" \
            "$GROUP_DIR/telegram-markdownv2-iosarm64/$VERSION/telegram-markdownv2-iosarm64-$VERSION.klib" \
            "$GROUP_DIR/telegram-markdownv2-iosx64/$VERSION/telegram-markdownv2-iosx64-$VERSION.klib" \
            "$GROUP_DIR/telegram-markdownv2-iossimulatorarm64/$VERSION/telegram-markdownv2-iossimulatorarm64-$VERSION.klib"; do
            test -f "$art" || { echo "missing artifact: $art"; exit 1; }
          done
          grep -q commonmark "$A/telegram-markdownv2-$VERSION.pom"
          echo "Published artifacts verified: $VERSION"

      # API reference from the KDoc, so the carefully-written docs are browsable without a
      # local Dokka run; uploaded as a workflow artifact (a Pages deployment can follow
      # once there is a docs workflow worth wiring)
      - name: Generate API documentation
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: Upload API documentation
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: build/dokka/html/**

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

  # iOS simulator and macOS Arm64 native tests need macOS; the ubuntu job already covers
  # cross-compilation
  apple-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      - name: Run macOS and iOS simulator tests
        run: chmod +x gradlew && ./gradlew macosArm64Test iosSimulatorArm64Test

      - name: Upload macOS and iOS test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore

  # mingwX64 native tests need a Windows host; the ubuntu job already covers
  # cross-compilation
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      - name: Run Windows native tests
        run: .\gradlew.bat mingwX64Test

      - name: Upload Windows test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore
